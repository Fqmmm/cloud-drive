<text x="820" y="527" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#334155" font-size="15">文件服务统一读写对象</text>

<g id="container-frontend"><rect x="460" y="230" width="320" height="80" rx="12" fill="#eff6ff" stroke="#0369a1" stroke-width="2" />
<text x="620.0" y="262" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#0f172a" font-size="21" font-weight="700">frontend</text>
<text x="620.0" y="288" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#334155" font-size="15">Vue 页面 + Nginx API 转发 · A</text>
</g>
<g id="container-auth"><rect x="100" y="390" width="240" height="100" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="2" />
<text x="220.0" y="422" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#0f172a" font-size="21" font-weight="700">auth-service</text>
<text x="220.0" y="448" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#334155" font-size="15">注册 / 登录 / JWT</text>
<text x="220.0" y="471" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#334155" font-size="15">本地验签公共约定 · A</text>
</g>
<g id="container-file"><rect x="500" y="390" width="240" height="100" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2" />
<text x="620.0" y="422" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#0f172a" font-size="21" font-weight="700">file-service</text>
<text x="620.0" y="448" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#334155" font-size="15">个人文件 / 目录 / 固定配额</text>
<text x="620.0" y="471" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#334155" font-size="15">对象生命周期 · B</text>
</g>
<g id="container-share"><rect x="900" y="390" width="240" height="100" rx="12" fill="#eff6ff" stroke="#0369a1" stroke-width="2" />
<text x="1020.0" y="422" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#0f172a" font-size="21" font-weight="700">share-service</text>
<text x="1020.0" y="448" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#334155" font-size="15">单文件分享 / 提取码 / 有效期</text>
<text x="1020.0" y="471" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#334155" font-size="15">匿名下载中转 · A</text>
</g>
<g id="container-mysql"><rect x="100" y="620" width="560" height="100" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" />
<text x="380.0" y="652" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#0f172a" font-size="21" font-weight="700">mysql</text>
<text x="380.0" y="678" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#334155" font-size="15">auth_db  |  file_db  |  share_db</text>
<text x="380.0" y="701" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#334155" font-size="15">三个账号分别访问各自数据库 · B</text>
</g>
<g id="container-minio"><rect x="900" y="620" width="240" height="100" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" />
<text x="1020.0" y="652" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#0f172a" font-size="21" font-weight="700">minio</text>
<text x="1020.0" y="678" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#334155" font-size="15">私有桶 cloud-drive</text>
<text x="1020.0" y="701" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#334155" font-size="15">保存实际文件 · B</text>
</g>
<text x="380" y="746" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#64748b" font-size="14">命名数据卷：mysql_data</text>
<text x="1020" y="746" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#64748b" font-size="14">命名数据卷：minio_data</text>
