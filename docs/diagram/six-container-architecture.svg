<text x="620" y="125" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#1e293b" font-size="16">用户浏览器（容器外）</text>
<rect x="40" y="175" width="1160" height="615" rx="16" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 6" />
<text x="60" y="202" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#64748b" font-size="14">Docker Compose / 容器网络：cloud-drive</text>
<path d="M620 145V230" fill="none" stroke="#0369a1" stroke-width="2.5" />
<text x="645" y="166" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#334155" font-size="15">HTTP :8080</text>
<path d="M620 310V345H220V390" fill="none" stroke="#0369a1" stroke-width="2.5" />
<path d="M620 310V390" fill="none" stroke="#0369a1" stroke-width="2.5" />
<path d="M620 345H1020V390" fill="none" stroke="#0369a1" stroke-width="2.5" />
<text x="225" y="333" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#334155" font-size="15">认证 / 基础资料</text>
<text x="637" y="369" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#334155" font-size="15">文件 / 目录 / 配额</text>
<text x="880" y="333" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#334155" font-size="15">分享 / 匿名访问</text>
<path d="M900 438H740" fill="none" stroke="#0369a1" stroke-width="2.5" />
<text x="820" y="419" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#334155" font-size="15">内部 HTTP</text>
<text x="820" y="466" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#64748b" font-size="14">凭证 + 文件归属校验</text>
<path d="M220 490V620" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 5" />
<text x="237" y="564" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#334155" font-size="15">auth_db</text>
<path d="M580 490V620" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 5" />
<text x="490" y="590" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#334155" font-size="15">file_db</text>
<path d="M1140 450H1175V750H700V670H660" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 5" />
<text x="920" y="775" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#334155" font-size="15">share_db（独立账号）</text>
