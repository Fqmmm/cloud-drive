<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" role="img" aria-labelledby="title desc">
<title id="title">Docker Compose 六容器个人网盘架构</title>
<desc id="desc">浏览器通过 Vue 和 Nginx 容器访问认证、文件、分享三个业务微服务。三个服务各自访问同一 MySQL 容器中的独立数据库，分享服务调用文件服务，文件服务统一访问 MinIO。MySQL 与 MinIO 挂载各自命名数据卷。</desc>
<defs>
 <marker id="http" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#0369a1" /></marker>
 <marker id="sql" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#7c3aed" /></marker>
 <marker id="object" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#15803d" /></marker>
</defs>
<rect width="1240" height="900" fill="#ffffff" />
<text x="40" y="45" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#0f172a" font-size="26" font-weight="700">个人网盘 · 六容器架构</text>
<text x="40" y="73" font-family="Microsoft YaHei, Noto Sans CJK SC, SimHei, sans-serif" fill="#64748b" font-size="14">3 个业务微服务 + 前端 + 数据库 + 对象存储</text>
