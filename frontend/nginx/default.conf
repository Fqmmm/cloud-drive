map $uri $course_upstream {
    default "";
    ~^/api/v1/(auth|users)/ auth-service:8080;
    ~^/api/v1/(files|directories)(/|$) file-service:8080;
    /api/v1/quota file-service:8080;
    ~^/api/v1/shares(/|$) share-service:8080;
    ~^/api/v1/s/ share-service:8080;
}

# Never log request URI, query, body or authorization: share tokens are capabilities.
log_format course '$request_id $request_method status=$status duration=$request_time upstream=$upstream_status';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    access_log /var/log/nginx/access.log course;
    error_log /var/log/nginx/error.log crit;
    client_max_body_size 105m;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    proxy_hide_header X-Request-Id;
    add_header X-Request-Id $request_id always;

    location = /healthz { access_log off; default_type text/plain; return 200 'UP\n'; }
    location = /api { return 404; }
    location ^~ /internal { return 404; }
    location ^~ /health { return 404; }

    location = /api/v1/files {
        include /etc/nginx/course-proxy.conf;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location ~ ^/api/v1/(files/[0-9]+/download|s/[^/]+/download)$ {
        include /etc/nginx/course-proxy.conf;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /api/ {
        include /etc/nginx/course-proxy.conf;
        proxy_read_timeout 15s;
    }

    location / { try_files $uri $uri/ /index.html; }
}
